name: AI Engagement Agent

on:
  schedule:
    # Run AI agent every 2 hours during business hours (8 AM - 8 PM Madrid time)
    - cron: '0 6,8,10,12,14,16,18 * * *'  # UTC times for Madrid business hours
    
    # Additional monitoring during peak engagement times
    - cron: '30 11,15,17 * * *'  # Peak engagement periods
  
  # Allow manual triggering for immediate AI agent activation
  workflow_dispatch:
    inputs:
      duration:
        description: 'Agent runtime duration in minutes'
        required: false
        default: '120'
        type: string
      mode:
        description: 'Agent operation mode'
        required: false
        default: 'standard'
        type: choice
        options:
        - standard
        - aggressive
        - conservative

jobs:
  ai-engagement-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # 2.5 hours max runtime
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tweepy anthropic openai notion-client python-dotenv httpx asyncio google-generativeai
    
    - name: Configure AI Agent
      env:
        DURATION: ${{ github.event.inputs.duration || '120' }}
        MODE: ${{ github.event.inputs.mode || 'standard' }}
      run: |
        echo "🤖 Configuring AI Engagement Agent"
        echo "Duration: ${DURATION} minutes"
        echo "Mode: ${MODE}"
        echo "Madrid time: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M %Z')"
        
        # Create agent configuration
        cat > agent_config.json << EOF
        {
          "runtime_minutes": ${DURATION},
          "operation_mode": "${MODE}",
          "monitoring_intervals": {
            "mentions": 300,
            "hashtags": 600,
            "trends": 1800,
            "competitors": 3600
          },
          "engagement_limits": {
            "hourly_responses": 5,
            "daily_responses": 25,
            "weekly_responses": 150
          }
        }
        EOF
    
    - name: Run AI Engagement Agent
      env:
        # Twitter API credentials
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        
        # Notion credentials
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        SOCIAL_MEDIA_DB_ID: ${{ secrets.SOCIAL_MEDIA_DB_ID }}
        
        # AI Providers
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      run: |
        echo "🚀 Starting AI Engagement Agent at $(date)"
        echo "Madrid time: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M %Z')"
        
        # Set timeout based on duration
        DURATION=${{ github.event.inputs.duration || '120' }}
        TIMEOUT=$((DURATION * 60))  # Convert to seconds
        
        # Run AI agent with timeout
        timeout ${TIMEOUT}s python3 main.py --mode=ai_agent --quiet || {
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 124 ]; then
            echo "✅ AI Agent completed scheduled runtime (${DURATION} minutes)"
          else
            echo "⚠️ AI Agent exited with code $EXIT_CODE"
          fi
        }
        
        echo "🏁 AI Agent session completed at $(date)"
    
    - name: Generate Agent Report
      if: always()
      run: |
        echo "📊 Generating AI Agent Performance Report"
        
        # Create performance report
        cat > agent_report.md << 'EOF'
        # AI Engagement Agent Report
        
        **Session Details:**
        - Start Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        - Madrid Time: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M %Z')
        - Duration: ${{ github.event.inputs.duration || '120' }} minutes
        - Mode: ${{ github.event.inputs.mode || 'standard' }}
        
        **Systems Status:**
        - ✅ AI Agent: Operational
        - ✅ Hashtag Tracker: Active
        - ✅ Response Generator: Ready
        - ✅ Strategy Engine: Analyzing
        
        **Key Features:**
        - 🔍 Continuous mention monitoring
        - 🏷️ Intelligent hashtag tracking
        - 🤖 AI-powered response generation
        - 📈 Strategic opportunity analysis
        - 🎯 Brand voice consistency
        - 🛡️ Safety and rate limiting
        
        **Monitoring Scope:**
        - Primary hashtags: #RestaurantTech, #SMEAnalytics, #MenuOptimization
        - Industry conversations: Restaurant analytics, dynamic pricing
        - Competitive intelligence: Toast, Square, OpenTable
        - Prospect signals: "looking for", "need help", "recommendations"
        
        **Next Steps:**
        - Monitor automation_logs/ for detailed results
        - Check Notion database for engagement analytics
        - Review GitHub Actions logs for any issues
        EOF
        
        echo "📄 Agent report generated"
    
    - name: Upload Agent Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ai-agent-logs-${{ github.run_number }}
        path: |
          logs/
          automation_logs/
          agent_config.json
          agent_report.md
        retention-days: 7
    
    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ AI Agent encountered an error"
        echo "Check the logs for detailed error information"
        echo "Common issues:"
        echo "- API rate limits exceeded"
        echo "- Network connectivity problems"
        echo "- Authentication failures"
        echo "- Notion database access issues"
    
    - name: Success Summary
      if: success()
      run: |
        echo "✅ AI Engagement Agent completed successfully!"
        echo "📊 Performance metrics saved to Notion database"
        echo "🔍 Engagement opportunities identified and processed"
        echo "🤖 AI responses generated with brand voice consistency"
        echo "📈 Strategic analysis completed"
        echo ""
        echo "Next scheduled run: Check workflow schedule"
        echo "Manual trigger: Use 'Run workflow' button for immediate activation"

  # Cleanup job to manage storage
  cleanup:
    runs-on: ubuntu-latest
    needs: ai-engagement-agent
    if: always()
    
    steps:
    - name: Cleanup Old Artifacts
      run: |
        echo "🧹 Cleanup job completed"
        echo "Old artifacts are automatically cleaned up by GitHub Actions retention policy"
