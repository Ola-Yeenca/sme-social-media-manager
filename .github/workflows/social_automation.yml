name: SME Analytica Social Media Automation

on:
  schedule:
    # Daily content generation at 8:00 AM UTC
    - cron: '0 8 * * *'
    # Midday posting at 13:00 UTC (1:00 PM)
    - cron: '0 13 * * *'
    # Evening engagement at 18:00 UTC (6:00 PM)
    - cron: '0 18 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - content
          - engagement
          - test
          - post_now

jobs:
  sme-social-automation:
    runs-on: ubuntu-latest
    
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      run: |
        echo "Setting up SME Analytica environment..."
        echo "Current time: $(date)"
        echo "Triggered by: ${{ github.event_name }}"
    
    # Skip debug steps for faster execution
    
    - name: Run automation based on trigger
      env:
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        SOCIAL_MEDIA_DB_ID: ${{ secrets.SOCIAL_MEDIA_DB_ID }}
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        POSTING_SCHEDULE: 3
        PRIMARY_LANGUAGE: en
        SECONDARY_LANGUAGE: es
        TIMEZONE: UTC
        DB_PATH: data/social_manager.db
        LOG_LEVEL: INFO
      run: |
        # Determine what action to run based on trigger time or manual input
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          ACTION="${{ github.event.inputs.action }}"
        elif [ "$(date +%H)" = "08" ]; then
          ACTION="content"
        elif [ "$(date +%H)" = "13" ]; then
          ACTION="post_now"
        elif [ "$(date +%H)" = "18" ]; then
          ACTION="engagement"
        else
          ACTION="daily"
        fi
        
        echo "Running action: $ACTION at $(date)"
        
        case $ACTION in
          "daily")
            echo "Running full daily automation..."
            python3 main.py --mode=enhanced --quiet
            ;;
          "content")
            echo "Generating content for the day..."
            python3 main.py --mode=content --quiet
            ;;
          "engagement")
            echo "Running engagement automation..."
            python3 main.py --mode=engagement --quiet
            ;;
          "post_now")
            echo "Posting scheduled content now..."
            python3 main.py --mode=enhanced --quiet
            ;;
          "test")
            echo "Running system test..."
            python3 main.py --status
            ;;
          *)
            echo "Unknown action: $ACTION"
            exit 1
            ;;
        esac
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automation-logs-${{ github.run_number }}
        path: |
          logs/
          data/
        retention-days: 30
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ SME Analytica automation failed at $(date)"
        echo "Check logs for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # You could add Slack/Discord notification here
    
    - name: Success summary
      if: success()
      run: |
        echo "✅ SME Analytica automation completed successfully at $(date)"
        echo "Action performed: ${{ github.event_name }}"
