name: Comprehensive Test Suite

# Run tests on pull requests and pushes to main
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - viral-prediction
      run_live_tests:
        description: 'Run live API tests (requires API keys)'
        required: false
        default: false
        type: boolean

jobs:
  # Job 1: Unit and Integration Tests
  unit-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        mypy bot.py viral_predictor.py config.py --ignore-missing-imports
    
    - name: Run viral prediction unit tests
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'unit' || github.event.inputs.test_type == 'viral-prediction' || github.event.inputs.test_type == '' }}
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY || 'test_key' }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET || 'test_secret' }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || 'test_token' }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || 'test_secret' }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN || 'test_bearer' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai' }}
      run: |
        python -m pytest test_viral_prediction.py -v --tb=short --cov=viral_predictor --cov-report=term-missing
    
    - name: Run bot integration tests
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'integration' || github.event.inputs.test_type == '' }}
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY || 'test_key' }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET || 'test_secret' }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || 'test_token' }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || 'test_secret' }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN || 'test_bearer' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai' }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test_anthropic' }}
      run: |
        python -m pytest test_bot_integration.py -v --tb=short --cov=bot --cov-report=term-missing
    
    - name: Generate coverage report
      run: |
        coverage xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
    
    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: unit-integration-test-results-${{ matrix.python-version }}
        path: |
          ./test-results/
          ./coverage.xml
        retention-days: 7

  # Job 2: End-to-End Tests with Playwright
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium
        python -m playwright install-deps
    
    - name: Run E2E tests
      if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'e2e' || github.event.inputs.test_type == '' }}
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY || 'test_key' }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET || 'test_secret' }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || 'test_token' }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || 'test_secret' }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN || 'test_bearer' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai' }}
        RUN_LIVE_TESTS: ${{ github.event.inputs.run_live_tests || 'false' }}
        CI: 'true'
      run: |
        python test_e2e_playwright.py
    
    - name: Upload E2E test artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-results
        path: |
          ./test-results/
          ./test-results/screenshots/
          ./test-results/videos/
          ./test-results/traces/
        retention-days: 7

  # Job 3: Comprehensive Test Runner
  comprehensive-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-integration-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
    
    - name: Install Playwright browsers
      run: |
        python -m playwright install chromium
        python -m playwright install-deps
    
    - name: Run comprehensive test suite
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY || 'test_key' }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET || 'test_secret' }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN || 'test_token' }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET || 'test_secret' }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN || 'test_bearer' }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test_openai' }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test_anthropic' }}
        RUN_LIVE_TESTS: ${{ github.event.inputs.run_live_tests || 'false' }}
        CI: 'true'
      run: |
        python run_all_tests.py
    
    - name: Upload comprehensive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-results
        path: |
          ./test-results/
        retention-days: 30

  # Job 4: Performance and Security Tests
  performance-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_test.txt
        pip install bandit safety
    
    - name: Run security analysis with bandit
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt
    
    - name: Check for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
    
    - name: Run performance benchmarks
      env:
        TWITTER_API_KEY: 'test_key'
        TWITTER_API_SECRET: 'test_secret'
        TWITTER_ACCESS_TOKEN: 'test_token'
        TWITTER_ACCESS_TOKEN_SECRET: 'test_secret'
        TWITTER_BEARER_TOKEN: 'test_bearer'
        OPENAI_API_KEY: 'test_openai'
      run: |
        python -m pytest -v --benchmark-only || echo "No benchmark tests found"
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # Job 5: Bot Functionality Validation
  bot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.run_live_tests == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate bot with live APIs (read-only)
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        echo "🔍 Validating bot configuration and API connectivity..."
        python -c "
        from bot import SMESocialBot
        try:
            bot = SMESocialBot(test_mode=True)
            content = bot.generate_content()
            if content:
                print('✅ Content generation working')
            else:
                print('❌ Content generation failed')
            score = bot.viral_predictor.predict_viral_potential(content or 'Test tweet')
            print(f'✅ Viral prediction working: {score.total_score}/100')
        except Exception as e:
            print(f'❌ Bot validation failed: {e}')
            exit(1)
        "
    
    - name: Test viral prediction system
      run: |
        echo "🎯 Testing viral prediction system..."
        python bot.py --viral-test

# Notification job
  notify:
    runs-on: ubuntu-latest
    needs: [unit-integration-tests, e2e-tests, comprehensive-tests]
    if: always()
    
    steps:
    - name: Notify test completion
      run: |
        if [[ "${{ needs.unit-integration-tests.result }}" == "success" && "${{ needs.e2e-tests.result }}" == "success" && "${{ needs.comprehensive-tests.result }}" == "success" ]]; then
          echo "🎉 All tests passed! SME Social Media Bot is ready."
        else
          echo "⚠️ Some tests failed. Check the logs for details."
        fi