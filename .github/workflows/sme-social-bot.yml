name: SME Social Media Bot - Multi-Product Automation

# Content manager for SME Analytica product family:
# - smeanalytica.dev (general SME)
# - restaurants.smeanalytica.dev (MenuFlow)
# - conversa.smeanalytica.dev (Conversa CX)
# - regula-ai.com (Regula AI compliance)

on:
  schedule:
    # Natural posting schedule: once per run (bot now posts 1 unique tweet per execution)
    - cron: '0 8 * * *'     # 8 AM UTC daily
    - cron: '0 13 * * *'    # 1 PM UTC daily
    - cron: '0 18 * * *'    # 6 PM UTC daily
    - cron: '0 8 * * 0'     # Sunday 8 AM UTC (weekly full engagement)

  workflow_dispatch:
    inputs:
      mode:
        description: 'Bot mode'
        required: false
        default: 'posting-only'
        type: choice
        options:
          - posting-only      # Content creation with viral prediction
          - full              # Full engagement (mentions + posting)
          - weekly            # Weekly full engagement (process 7 days mentions)
          - viral-test        # Test viral prediction system
          - test              # Dry run (no API calls)
      industry:
        description: 'Target product/industry'
        required: false
        default: 'restaurant'
        type: choice
        options:
          - restaurant        # MenuFlow (restaurants.smeanalytica.dev)
          - compliance        # Regula AI (regula-ai.com)
          - conversa          # Conversa (conversa.smeanalytica.dev)
          - real_estate       # Future vertical
          - general           # SME Analytica (smeanalytica.dev)

jobs:
  social-media-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Determine bot mode and industry
      id: config
      run: |
        # Mode selection
        MODE="${{ github.event.inputs.mode || 'auto' }}"

        if [ "$MODE" = "auto" ]; then
          # Sunday 8 AM = weekly engagement mode
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "08" ]; then
            MODE="weekly"
          else
            MODE="posting-only"
          fi
        fi

        # Industry selection (default: restaurant for MenuFlow)
        INDUSTRY="${{ github.event.inputs.industry || 'restaurant' }}"

        echo "mode=$MODE" >> $GITHUB_OUTPUT
        echo "industry=$INDUSTRY" >> $GITHUB_OUTPUT
        echo "::notice::Mode: $MODE | Industry: $INDUSTRY"

    - name: Run SME Social Media Bot
      env:
        # Twitter API (Required)
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}

        # LinkedIn API (Optional)
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}

        # AI Providers (fallback chain: OpenAI -> Anthropic -> Groq)
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GROK_API_KEY: ${{ secrets.GROQ_API_KEY }}

        # Product/Industry targeting
        SME_INDUSTRY: ${{ steps.config.outputs.industry }}

        # Optional integrations
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        SOCIAL_MEDIA_DB_ID: ${{ secrets.SOCIAL_MEDIA_DB_ID }}

      run: |
        echo "========================================"
        echo "SME Social Media Bot"
        echo "========================================"
        echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Mode: ${{ steps.config.outputs.mode }}"
        echo "Product: ${{ steps.config.outputs.industry }}"
        echo "Platforms: Twitter + LinkedIn"
        echo "========================================"

        case "${{ steps.config.outputs.mode }}" in
          "posting-only")
            echo "Posting-only mode: 1 viral-optimized post"
            python bot.py --posting-only --multi-platform
            ;;
          "full")
            echo "Full mode: posting + engagement"
            python bot.py --multi-platform
            ;;
          "weekly")
            echo "Weekly mode: full engagement + 7-day mentions"
            python bot.py --weekly-engagement --multi-platform
            ;;
          "viral-test")
            echo "Testing viral prediction system"
            python bot.py --viral-test
            ;;
          "test")
            echo "Dry run mode"
            python bot.py --test
            ;;
          *)
            echo "Unknown mode, using posting-only"
            python bot.py --posting-only --multi-platform
            ;;
        esac

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bot-run-${{ github.run_number }}-${{ steps.config.outputs.industry }}
        path: |
          *.log
          viral_scores.json
          test-results/
        retention-days: 7
        if-no-files-found: ignore

    - name: Job summary
      if: always()
      run: |
        echo "## Bot Run Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Mode | ${{ steps.config.outputs.mode }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Product | ${{ steps.config.outputs.industry }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Time | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
        echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
