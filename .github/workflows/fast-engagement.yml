name: Fast Grok Engagement

on:
  schedule:
    # Evening engagement at 18:00 UTC (6:00 PM) - 8:00 PM Madrid
    - cron: '0 18 * * *'
  
  # Allow manual triggering for immediate engagement
  workflow_dispatch:

jobs:
  grok-engagement:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install dependencies (minimal)
      run: |
        python -m pip install --upgrade pip
        pip install tweepy anthropic notion-client python-dotenv
    
    - name: Run Grok Engagement
      env:
        # Twitter API credentials
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        
        # Notion credentials
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        SOCIAL_MEDIA_DB_ID: ${{ secrets.SOCIAL_MEDIA_DB_ID }}
        
        # AI Provider (Anthropic preferred)
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        echo "🤖 Starting fast Grok engagement at $(date)"
        echo "Madrid time: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M %Z')"
        
        # Run engagement mode only - fast execution
        python3 main.py --mode=engagement --quiet
        
        echo "✅ Grok engagement completed at $(date)"
    
    - name: Upload minimal logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grok-engagement-${{ github.run_number }}
        path: logs/
        retention-days: 7
