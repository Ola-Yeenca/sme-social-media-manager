name: Fast Grok Engagement

on:
  schedule:
    # Evening engagement at 18:00 UTC (6:00 PM) - 8:00 PM Madrid
    - cron: '0 18 * * *'
  
  # Allow manual triggering for immediate engagement
  workflow_dispatch:

jobs:
  grok-engagement:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies (AI-optimized)
      run: |
        python -m pip install --upgrade pip
        pip install tweepy anthropic openai notion-client python-dotenv httpx
    
    - name: Run Grok Engagement
      env:
        # Twitter API credentials
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        
        # Notion credentials
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        SOCIAL_MEDIA_DB_ID: ${{ secrets.SOCIAL_MEDIA_DB_ID }}
        
        # AI Providers (for dynamic question generation)
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      run: |
        echo "🤖 Starting AI-driven Grok engagement at $(date)"
        echo "Madrid time: $(TZ='Europe/Madrid' date '+%Y-%m-%d %H:%M %Z')"

        # Run AI-powered engagement mode - strategic business influence
        python3 main.py --mode=engagement --quiet

        echo "✅ AI-driven Grok engagement completed at $(date)"
    
    - name: Upload minimal logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grok-engagement-${{ github.run_number }}
        path: logs/
        retention-days: 7
